name: Fetch ONNX Model from Google Drive

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  fetch-onnx-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ONNX model files via Google Drive API
        env:
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
        run: |
          set -e

          download_file() {
            FILE_ID="$1"
            OUT_NAME="$2"
            URL="https://www.googleapis.com/drive/v3/files/${FILE_ID}?alt=media&key=${GDRIVE_API_KEY}"
            echo "Downloading ${OUT_NAME} ..."
            HTTP_CODE=$(curl -L -o "${OUT_NAME}" -w "%{http_code}" -s "${URL}")
            if [ "${HTTP_CODE}" != "200" ]; then
              echo "エラー: ${OUT_NAME} のダウンロードに失敗しました (HTTP ${HTTP_CODE})"
              cat "${OUT_NAME}"
              exit 1
            fi
          }

          download_file "1Tvvucl4T0xxDy-8iRwhCncZ5ekZbwR_G" "bigvgan_generator.onnx"
          download_file "1vns9vwDBVtbhfLazBgagvA-aWoUzkpTE" "bigvgan_generator.onnx.data"

          ls -lh bigvgan_generator.onnx bigvgan_generator.onnx.data

      - name: Validate downloaded files
        run: |
          for f in bigvgan_generator.onnx bigvgan_generator.onnx.data; do
            if head -c 200 "$f" | grep -qi "<html\|<!DOCTYPE\|<?xml\|\"error\""; then
              echo "エラー: $f がエラーページ/JSONエラーになっています。"
              echo "--- $f の内容(先頭500バイト) ---"
              head -c 500 "$f"
              exit 1
            fi
            FILESIZE=$(stat -c%s "$f")
            echo "$f size: $FILESIZE bytes"
            if [ "$FILESIZE" -lt 10000 ]; then
              echo "エラー: $f のサイズが小さすぎます。"
              cat "$f"
              exit 1
            fi
          done

      - name: Verify ONNX model loads correctly
        run: |
          pip install onnx
          python -c "
          import onnx
          model = onnx.load('bigvgan_generator.onnx')
          onnx.checker.check_model(model)
          print('ONNX model is valid.')
          "

      - name: Upload ONNX artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnx-model
          path: |
            bigvgan_generator.onnx
            bigvgan_generator.onnx.data
