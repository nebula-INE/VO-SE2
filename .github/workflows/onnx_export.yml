name: Fetch ONNX Model from Google Drive

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  fetch-onnx-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "gdown>=5.1.0"

      - name: Download ONNX model files from Google Drive
        run: |
          python -c "
          import gdown

          # 本体ファイル (.onnx)
          gdown.download(id='1Tvvucl4T0xxDy-8iRwhCncZ5ekZbwR_G', output='bigvgan_generator.onnx', quiet=False)

          # 外部データファイル (.onnx.data) ※ 本体と同じベース名にする必要あり
          gdown.download(id='1vns9vwDBVtbhfLazBgagvA-aWoUzkpTE', output='bigvgan_generator.onnx.data', quiet=False)
          "
          ls -lh bigvgan_generator.onnx bigvgan_generator.onnx.data

      - name: Validate downloaded files
        run: |
          for f in bigvgan_generator.onnx bigvgan_generator.onnx.data; do
            # HTMLエラーページが降ってきていないかチェック
            if head -c 200 "$f" | grep -qi "<html\|<!DOCTYPE\|<?xml"; then
              echo "エラー: $f がHTML/XMLのエラーページになっています。Google Driveの共有設定を確認してください。"
              echo "--- $f の内容(先頭500バイト) ---"
              head -c 500 "$f"
              exit 1
            fi
            FILESIZE=$(stat -c%s "$f")
            echo "$f size: $FILESIZE bytes"
            if [ "$FILESIZE" -lt 10000 ]; then
              echo "エラー: $f のサイズが小さすぎます。ダウンロードに失敗している可能性があります。"
              cat "$f"
              exit 1
            fi
          done

      - name: Verify ONNX model loads correctly
        run: |
          pip install onnx
          python -c "
          import onnx
          model = onnx.load('bigvgan_generator.onnx')
          onnx.checker.check_model(model)
          print('ONNX model is valid.')
          "

      - name: Upload ONNX artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnx-model
          path: |
            bigvgan_generator.onnx
            bigvgan_generator.onnx.data
