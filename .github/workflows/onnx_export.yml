name: Export ONNX Model from Google Drive Source

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "gdown>=5.1.0" torch torchvision onnx

      - name: Download model file from Google Drive
        run: |
          python -c "
          import gdown
          file_id = '1vns9vwDBVtbhfLazBgagvA-aWoUzkpTE'
          gdown.download(id=file_id, output='downloaded_model.pt', quiet=False)
          "
          ls -lh downloaded_model.pt

      - name: Validate downloaded file
        run: |
          # ダウンロードされたファイルの先頭を確認し、HTML(エラーページ)でないかチェック
          if head -c 200 downloaded_model.pt | grep -qi "<html\|<!DOCTYPE"; then
            echo "エラー: HTMLファイルがダウンロードされました。Google Driveの共有設定を「リンクを知っている全員が閲覧可」に変更してください。"
            echo "--- ダウンロード内容の先頭 ---"
            head -c 500 downloaded_model.pt
            exit 1
          fi
          file downloaded_model.pt
          FILESIZE=$(stat -c%s downloaded_model.pt)
          echo "Downloaded file size: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 10000 ]; then
            echo "エラー: ファイルサイズが小さすぎます。ダウンロードに失敗している可能性があります。"
            cat downloaded_model.pt
            exit 1
          fi

      - name: Convert model to ONNX
        run: |
          python -c "
          import torch

          print('Loading model...')
          try:
              model = torch.jit.load('downloaded_model.pt')
          except Exception:
              # PyTorch 2.6+ の仕様変更に対応するため weights_only=False を指定
              model = torch.load('downloaded_model.pt', map_location='cpu', weights_only=False)
          
          if hasattr(model, 'eval'):
              model.eval()

          # モデルの入力シェイプに合わせて変更してください
          dummy_input = torch.randn(1, 3, 224, 224)

          onnx_path = 'output_model.onnx'
          print(f'Exporting to {onnx_path}...')
          torch.onnx.export(
              model,
              dummy_input,
              onnx_path,
              export_params=True,
              opset_version=14,
              do_constant_folding=True,
              input_names=['input'],
              output_names=['output'],
              dynamic_axes={'input': {0: 'batch_size'}, 'output': {0: 'batch_size'}}
          )
          print('Export successful!')
          "

      - name: Upload ONNX artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnx-model
          path: output_model.onnx
